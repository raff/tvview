# Generate the Xcode project with:  xcodegen generate   (in this directory)
# The .xcodeproj is not committed; this file is the source of truth.
name: TVView
options:
  bundleIdPrefix: io.github.raff
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Needed to run on a device or to sign for distribution; the simulator and
    # the ad-hoc signed Mac build do not use it. A team ID is not a secret (it is
    # in every app you sign).
    DEVELOPMENT_TEAM: EDG4R37566
packages:
  TVCore:
    path: TVCore

# One source of truth for the page scripts and the default config: the files in
# the repo root, which the Go app embeds too.
# The page scripts and the default config are the files in the repo root, which
# the Go app embeds too: one source of truth. (Listed per target; XcodeGen does
# not flatten a shared list.)

targets:
  TVView-macOS:
    type: application
    platform: macOS
    sources:
      - App/Shared
      - App/macOS
      # The privileged helper the VPN library runs (swift/vpn/build.sh builds it).
      # The library looks for it beside the app's own executable, as the Go app does.
      - path: build/vpnhelper
        optional: true   # made by swift/vpn/build.sh; the Makefile builds it first
        buildPhase:
          copyFiles:
            destination: executables
            subpath: ""
        attributes: [CodeSignOnCopy]
      - { path: ../sidebar.js, buildPhase: resources }
      - { path: ../settings.js, buildPhase: resources }
      - { path: ../hide.js, buildPhase: resources }
      - { path: ../mediasession.js, buildPhase: resources }
      - { path: ../channels.yaml, buildPhase: resources }
    dependencies:
      - package: TVCore
      - framework: build/TVVPN.xcframework
        embed: false
    settings:
      base:
        PRODUCT_NAME: TV View
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The in-process WireGuard library (swift/vpn) is Go and wants these.
        OTHER_LDFLAGS: "-lresolv -framework CoreFoundation -framework Security"
        PRODUCT_BUNDLE_IDENTIFIER: io.github.raff.tvview.swift
        CODE_SIGN_IDENTITY: "-"
        # Unsandboxed so the config is found in iCloud Drive/tvview and
        # ~/.config/tvview like the Go app. A Mac App Store build would need
        # the sandbox and a different config location (see PORTING.md).
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.entertainment
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
    info:
      path: App/macOS/Info.plist
      properties:
        CFBundleName: TV View
        CFBundleDisplayName: TV View
        LSMinimumSystemVersion: "14.0"
        NSHighResolutionCapable: true

  TVView-iOS:
    type: application
    platform: iOS
    sources:
      - App/Shared
      - App/iOS
      - { path: ../sidebar.js, buildPhase: resources }
      - { path: ../settings.js, buildPhase: resources }
      - { path: ../hide.js, buildPhase: resources }
      - { path: ../mediasession.js, buildPhase: resources }
      - { path: ../channels.yaml, buildPhase: resources }
    dependencies:
      - package: TVCore
      - framework: build/TVVPN.xcframework
        embed: false
      - target: TVView-Tunnel   # the system VPN's tunnel, embedded in PlugIns
    entitlements:
      path: App/iOS/TVView.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
    settings:
      base:
        PRODUCT_NAME: TV View
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The in-process WireGuard library (swift/vpn) is Go and wants these.
        OTHER_LDFLAGS: "-lresolv -framework CoreFoundation -framework Security"
        PRODUCT_BUNDLE_IDENTIFIER: io.github.raff.tvview.swift
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    info:
      path: App/iOS/Info.plist
      properties:
        CFBundleDisplayName: TV View
        UIBackgroundModes: [audio]
        # Documents shows up in Files, so channels.yaml can be edited there.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true

  # The packet tunnel behind the iOS app's system VPN. Its bundle ID must be the app's plus a
  # suffix, and it needs its own App ID with the Network Extensions capability (see
  # swift/README.md, "One-time Apple Developer setup"). Device only: the simulator cannot run a packet tunnel.
  TVView-Tunnel:
    type: app-extension
    platform: iOS
    sources:
      - App/Tunnel
    dependencies:
      - package: TVCore
      - framework: build/TVVPN.xcframework
        embed: false
    entitlements:
      path: App/Tunnel/TVViewTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
    settings:
      base:
        PRODUCT_NAME: TVViewTunnel
        PRODUCT_BUNDLE_IDENTIFIER: io.github.raff.tvview.swift.tunnel
        OTHER_LDFLAGS: "-lresolv -framework CoreFoundation -framework Security"
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: TV View Tunnel
    info:
      path: App/Tunnel/Info.plist
      properties:
        CFBundleDisplayName: TV View Tunnel
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
